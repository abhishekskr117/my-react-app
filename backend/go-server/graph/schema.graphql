directive @auth on FIELD_DEFINITION

type Query {
  me: User! @auth
  users: [User!]! @auth
  
  inventory: [Inventory!]! @auth
  inventoryByID(id: Int!): Inventory @auth
  
  sales: [Sale!]! @auth
  saleByID(id: Int!): Sale @auth
  
  orders: [Order!]! @auth
  orderByID(id: Int!): Order @auth
  
  workOrders: [WorkOrder!]! @auth
  workOrderByID(id: Int!): WorkOrder @auth
}

type Mutation {
  login(username: String!, password: String!): AuthPayload!
  
  createInventory(input: CreateInventoryInput!): Inventory! @auth
  updateInventory(id: Int!, input: UpdateInventoryInput!): Inventory! @auth
  deleteInventory(id: Int!): Boolean! @auth
  
  createSale(input: CreateSaleInput!): Sale! @auth
  updateSale(id: Int!, input: UpdateSaleInput!): Sale! @auth
  
  createOrder(input: CreateOrderInput!): Order! @auth
  updateOrder(id: Int!, input: UpdateOrderInput!): Order! @auth
  
  createWorkOrder(input: CreateWorkOrderInput!): WorkOrder! @auth
  updateWorkOrder(id: Int!, input: UpdateWorkOrderInput!): WorkOrder! @auth
}

type User {
  id: Int!
  username: String!
  role: String!
  createdAt: String!
}

type Inventory {
  id: Int!
  name: String!
  quantity: Int!
  type: String!
  createdAt: String!
}

type Sale {
  id: Int!
  product: String!
  quantity: Int!
  price: Float!
  date: String!
  createdAt: String!
}

type Order {
  id: Int!
  customer: String!
  product: String!
  quantity: Int!
  status: String!
  createdAt: String!
}

type WorkOrder {
  id: Int!
  task: String!
  assignedTo: String
  status: String!
  createdAt: String!
}

type AuthPayload {
  token: String!
  user: User!
}

input CreateInventoryInput {
  name: String!
  quantity: Int!
  type: String!
}

input UpdateInventoryInput {
  name: String
  quantity: Int
  type: String
}

input CreateSaleInput {
  product: String!
  quantity: Int!
  price: Float!
  date: String!
}

input UpdateSaleInput {
  product: String
  quantity: Int
  price: Float
  date: String
}

input CreateOrderInput {
  customer: String!
  product: String!
  quantity: Int!
  status: String!
}

input UpdateOrderInput {
  customer: String
  product: String
  quantity: Int
  status: String
}

input CreateWorkOrderInput {
  task: String!
  assignedTo: String
  status: String!
}

input UpdateWorkOrderInput {
  task: String
  assignedTo: String
  status: String
}
